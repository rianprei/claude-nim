[package]
name = "nim-proxy"
version = "2.0.0"
edition = "2021"
description = "Proxy Anthropic Messages API para Claude Code: NVIDIA NIM + passthrough Anthropic"
license = "MIT"
repository = "https://github.com/rianprei/claude-nim"
readme = "README.md"
keywords = ["claude-code", "anthropic", "nvidia-nim", "proxy", "llm"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "signal", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
bytes = "1.12.1"
tokio-stream = { version = "0.1", features = ["sync"] }
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["tokio", "server"] }
http-body = "1.1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
